name: Android arm64 Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feat/**'

permissions:
  contents: read

jobs:
  build-arm64-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 與 Android Studio 自帶的 JetBrains Runtime 21 保持一致，編譯速度顯著提升
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 官方 Gradle 構建緩存，自動緩存依賴與任務輸出
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Create CI-only Google services configuration
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-ci",
              "storage_bucket": "rikkahub-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {"package_name": "me.rerere.rikkahub"}
                },
                "api_key": [{"current_key": "CI_BUILD_ONLY"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {"package_name": "me.rerere.rikkahub.debug"}
                },
                "api_key": [{"current_key": "CI_BUILD_ONLY"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace

      - name: Run lint advisory
        continue-on-error: true
        run: ./gradlew lint --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build unsigned arm64 release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --stacktrace -Parm64Only=true

      - name: Upload unsigned arm64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 14
