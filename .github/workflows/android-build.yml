name: Android Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feat/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer hosted by Google.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # API 37 platform packages use minor-versioned IDs.
          # The app requests compileSdk 37.2 in app/build.gradle.kts.
          sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Create CI-only Google services configuration
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-ci",
              "storage_bucket": "rikkahub-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {"package_name": "me.rerere.rikkahub"}
                },
                "api_key": [{"current_key": "CI_BUILD_ONLY"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {"package_name": "me.rerere.rikkahub.debug"}
                },
                "api_key": [{"current_key": "CI_BUILD_ONLY"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace

      - name: Run lint (advisory)
        continue-on-error: true
        run: ./gradlew lint --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build unsigned arm64 release APK
        run: ./gradlew assembleRelease --stacktrace -Parm64Only=true

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
